<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M8 2 L14 13 L8 10 L2 13 Z' fill='%23f7fbff'/%3E%3C/svg%3E">
  <meta name="description" content="纸飞机防线：驾驶纸飞机，挡住六波来袭的纸鹤。">
  <title>纸飞机防线</title>
  <style>
    :root { color-scheme: dark; --ink: #f4f7fb; --muted: #d5e2f2; --gold: #ffe08a; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "WenQuanYi Micro Hei", "Droid Sans Fallback", sans-serif;
      color: var(--ink);
      background: #16324d;
    }
    button { font: inherit; -webkit-tap-highlight-color: transparent; }
    a { color: var(--gold); text-decoration: none; }
    .wrap { width: min(480px, calc(100% - 16px)); margin: 0 auto; padding: 12px 0 22px; }
    header { display: flex; justify-content: space-between; align-items: flex-end; }
    .eyebrow { margin: 0; color: var(--gold); letter-spacing: .14em; font-size: .78rem; }
    h1 { margin: 2px 0 8px; font-size: 1.55rem; }
    .stage { position: relative; border-radius: 18px; overflow: hidden; border: 1px solid #9fc0de; }
    canvas { display: block; width: 100%; height: auto; background: #8ec6ea; touch-action: none; }
    .hud {
      position: absolute; top: 8px; left: 8px; right: 8px;
      display: flex; justify-content: space-between; font-weight: 800;
      color: #17324a; text-shadow: 0 1px 0 rgba(255,255,255,.4);
      pointer-events: none;
    }
    .help, .credit { color: var(--muted); font-size: .85rem; line-height: 1.6; }
    .keys { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .keys button { min-height: 48px; border: 0; border-radius: 14px; background: #245074; color: white; font-weight: 800; cursor: pointer; }
    .mask { position: absolute; inset: 0; background: rgba(12, 32, 48, .55); display: grid; place-items: center; padding: 16px; }
    .mask[hidden] { display: none; }
    .card { width: min(380px, 100%); background: rgba(18, 42, 64, .92); border-radius: 18px; padding: 18px; }
    .card h2 { margin: 0 0 8px; }
    .card p { color: var(--muted); line-height: 1.7; margin: 0 0 12px; }
    .card button { border: 0; background: var(--gold); color: #3a2a10; font-weight: 800; border-radius: 999px; padding: 10px 16px; cursor: pointer; }

    /* Scene art is embedded below so the downloaded HTML also works offline. */
    :root { --gold:#ffd38c; --ink:#fff7e7; --muted:#e3d6be; color-scheme:dark; }
    body { background:linear-gradient(90deg,rgba(6,25,31,.15),rgba(6,20,28,.48)),var(--scene) center/cover fixed; background-color:#17353d; }
    body::before { display:none; }
    .wrap { position:relative; padding-top:24px; }
    header { align-items:center; margin-bottom:16px; gap:12px; }
    h1:focus { outline:none; }
    header h1 { font-family:Georgia,'STSong','SimSun',serif; font-size:2rem; letter-spacing:.12em; text-shadow:0 2px 12px #15272c; }
    header a { padding:10px 12px; border:1px solid #fff5; border-radius:24px; background:#112b35b8; white-space:nowrap; font-size:12px; text-decoration:none; }
    .eyebrow { font-size:10px; letter-spacing:.3em; color:#ffe6b3; }
    .scene-strip { height:140px; margin:0 0 16px; border-radius:20px; background:linear-gradient(0deg,#092c3677,transparent 70%),var(--scene) center/cover; border:1px solid #f5d9a46b; position:relative; box-shadow:0 14px 36px #0003; }
    .scene-strip p { position:absolute; bottom:12px; left:18px; margin:0; font-family:Georgia,'STSong','SimSun',serif; letter-spacing:.15em; color:white; text-shadow:0 1px 5px #123; font-size:16px; }
    .world-intro { display:none; }
    .stat,.nextbox { background:linear-gradient(145deg,#fff9eaf7,#eadcc5ed); border:1px solid #fff5df; border-radius:12px; color:#3a453e; box-shadow:0 3px 0 #122c3b30,0 6px 16px #0002; }
    .stat span,.nextbox span { color:#78664d; font-size:11px; letter-spacing:.06em; }
    .stat b { color:#334d49; font-size:24px; }
    .help,.credit { color:#f3e3c7; text-shadow:0 1px 4px #000; }
    .help { padding:10px 14px; border-radius:10px; background:#112535d9; }
    .credit { font-size:11px; letter-spacing:.1em; }
    .pad button,.keys button,.actions button,.tools button { border-radius:12px; min-height:46px; box-shadow:0 3px 0 #0004; }
    .pad button,.keys button { background:linear-gradient(#3b5261,#233845); border:1px solid #77817c; color:#fff2d6; }
    .pad button.gold,.actions button:not(.ghost),.tools button,#jump { background:linear-gradient(#ffe6ad,#e5b36b); color:#523718; border:1px solid #ffedc1; }
    .actions button.ghost { background:#143642e6; }
    button { touch-action:manipulation; }
    button:active { filter:brightness(.92); }
    button:focus-visible,a:focus-visible { outline:3px solid #fff3b6; outline-offset:3px; }
    .mask { position:fixed; z-index:20; background:#071c306b; backdrop-filter:blur(7px); padding:20px; overflow:auto; }
    .mask .card,.mask .panel { color:#3d483f; background:linear-gradient(135deg,#fffaf0,#f0e2c9); border:1px solid #fff0c7; border-radius:24px; padding:22px; width:min(420px,100%); max-height:calc(100dvh - 40px); overflow:auto; box-shadow:0 28px 90px #05172a66; }
    .mask .card::before,.mask .panel::before { content:''; display:block; height:150px; margin:-22px -22px 20px; background:var(--scene) center/cover; border-bottom:3px solid #d3ab69; }
    .mask h2 { font-family:Georgia,'STSong','SimSun',serif; font-size:28px; letter-spacing:.12em; }
    .mask p { color:#75664e; font-size:14px; line-height:1.85; }
    .mask button { background:linear-gradient(#e6a553,#c17930); color:#fff9e9; min-height:48px; width:100%; border:1px solid #af6d30; border-radius:12px; box-shadow:0 3px 0 #986131; letter-spacing:.16em; }
    .sound { font:inherit; font-size:11px; border:1px solid #f9dda777; background:#132d3edb; color:#ffe6b3; padding:9px 13px; border-radius:20px; cursor:pointer; min-height:44px; }
    .spark { position:fixed; width:6px; height:6px; border-radius:50%; background:#ffefb5; box-shadow:0 0 10px #ffe09c; pointer-events:none; z-index:30; }
    @media(min-width:1100px) {
      body:not(.wide-game) .wrap { width:500px; margin-left:calc(50% + 30px); margin-right:auto; }
      body:not(.wide-game) .scene-strip { display:none; }
      .world-intro { display:block; position:fixed; top:27%; left:max(5%,calc(50% - 530px)); width:390px; pointer-events:none; text-shadow:0 3px 24px #04212b; }
      .world-intro small { letter-spacing:.4em; color:#ffe9bb; }
      .world-intro h2 { font:64px/1.35 Georgia,'STSong','SimSun',serif; letter-spacing:.15em; margin:20px 0; color:#fff9e9; }
      .world-intro p { font:18px/2 Georgia,'STSong','SimSun',serif; letter-spacing:.14em; color:#fff1d4; }
      .wide-game .world-intro { display:none; }
    }
    @media(max-width:600px) {
      .wrap { padding-top:16px; }
      header h1 { font-size:26px; }
      .scene-strip { height:116px; margin-bottom:12px; }
      .stat { padding:7px 10px; }
      .stat b { font-size:21px; }
      .mask .card::before,.mask .panel::before { height:130px; }
    }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important; transition:none!important; scroll-behavior:auto!important; } }


    .stage { border:3px solid #efe5c9; border-radius:18px; box-shadow:0 7px 0 #6c8c8f,0 15px 40px #15394744; }
    .stage .hud { color:#294b59; background:#fffae6dd; padding:10px; border:1px solid #fff8de; border-radius:9px; font-size:12px; }
    .scene-strip { height:88px; }
    @media(min-width:1100px) { .paper-plane-line .wrap { width:390px; } }
    @media(max-width:600px) { .paper-plane-line .wrap { width:min(360px,calc(100% - 20px)); } .scene-strip { display:none; } }
  </style>

  <div class="wrap">
    <header>
      <div>
        <p class="eyebrow">纸上射击</p>
        <h1>纸飞机防线</h1>
      </div>
      <a href="../../index.html">返回目录</a>
    </header>
    <div class="scene-strip" aria-hidden="true"><p>折一页晴空，飞过小城。</p></div>

          <p id="maskText"></p>
          <button type="button" id="maskBtn">起飞</button>
        </div>
      </div>
    </div>
    <div class="keys">
      <button type="button" id="left">向左</button>
      <button type="button" id="right">向右</button>

    <p class="help">拖动飞机，或按住左右按钮 / 方向键移动。飞机自己扔纸片。别撞上来机，也别让它们从底线飞走。守完六波就收工。金色纸条会暂时加快投掷。</p>
    <p class="credit">杨老师玩AI · AI 生成</p>

      const picture = new Image(); picture.src = ART_DATA;

          oscillator.connect(gain); gain.connect(audio.destination); oscillator.start(t); oscillator.stop(t+.24);

    function saveBest() {
      if (score <= best) return;
      best = score;
      try { localStorage.setItem("aimg-plane-best", String(best)); } catch (e) {}
    }
    function sync() {
      document.getElementById("score").textContent = score + " 分";
      document.getElementById("wave").textContent = "第 " + Math.min(wave + 1, 6) + " / 6 波";
      document.getElementById("lives").textContent = "纸页 × " + lives;
    }
    function showMask(title, text, btn, fn) {
      document.getElementById("maskTitle").textContent = title;
      document.getElementById("maskText").textContent = text;
      const b = document.getElementById("maskBtn");
      b.textContent = btn;
      b.onclick = fn;
      document.getElementById("mask").hidden = false;
    }
    function rand(a, b) { return a + Math.random() * (b - a); }

    function beginWave(index) {
      const spec = WAVES[index];
      queue = [];
      for (let i = 0; i < spec.small; i++) queue.push("small");
      for (let i = 0; i < spec.big; i++) queue.push("big");
      for (let i = 0; i < spec.weave; i++) queue.push("weave");
      for (let i = queue.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const tmp = queue[i]; queue[i] = queue[j]; queue[j] = tmp;
      }
      spawnIn = 0.45;
      calm = 0.7;
      sync();
    }

    function reset() {
      player.x = W / 2; player.inv = 0; player.rapid = 0;
      bullets = []; enemies = []; shots = []; drops = []; floats = [];
      score = 0; lives = 4; wave = 0; fireIn = 0;
      state = "play";
      beginWave(0);
    }

    function spawnEnemy(kind) {
      const base = { kind, x: rand(36, W - 36), y: -30, t: Math.random() * 6, shoot: rand(0.8, 1.6) };
      if (kind === "small") enemies.push({ ...base, hp: 1, r: 16, vy: rand(70, 100), amp: 0, freq: 0, score: 100 });
      else if (kind === "big") enemies.push({ ...base, hp: 3, r: 26, vy: rand(42, 62), amp: 18, freq: 1.4, score: 300 });
      else enemies.push({ ...base, hp: 2, r: 18, vy: rand(78, 110), amp: 70, freq: 2.2, score: 180 });
    }

    function hurt() {
      if (player.inv > 0 || state !== "play") return;
      lives--;
      player.inv = 1.15;
      sync();
      if (lives <= 0) {
        state = "over";
        saveBest();
        showMask("防线被啄穿了", "守到第 " + (wave + 1) + " 波，得分 " + score + "。最佳 " + best + " 分。", "再折一架", () => {
          document.getElementById("mask").hidden = true;
          reset();
        });
      }
    }

    function update(dt) {
      if (state !== "play") return;
      calm = Math.max(0, calm - dt);
      player.inv = Math.max(0, player.inv - dt);
      player.rapid = Math.max(0, player.rapid - dt);
      if (!dragging) {
        if (keys.left) player.x -= 260 * dt;
        if (keys.right) player.x += 260 * dt;
      }
      player.x = Math.max(28, Math.min(W - 28, player.x));
      fireIn -= dt;
      const gap = player.rapid > 0 ? 0.09 : 0.22;
      if (fireIn <= 0) {
        fireIn = gap;
        bullets.push({ x: player.x, y: player.y - 18, vy: -460, r: 4 });
      }
      bullets.forEach((b) => { b.y += b.vy * dt; });
      bullets = bullets.filter((b) => b.y > -10);

      if (queue.length && calm <= 0) {
        spawnIn -= dt;
        if (spawnIn <= 0) {
          spawnEnemy(queue.shift());
          spawnIn = WAVES[wave].gap;
        }
      }

      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.t += dt;
        e.y += e.vy * dt;
        if (e.amp) e.x += Math.sin(e.t * e.freq) * e.amp * dt;
        e.x = Math.max(e.r, Math.min(W - e.r, e.x));
        if (e.kind === "big") {
          e.shoot -= dt;
          if (e.shoot <= 0 && e.y > 20 && e.y < H * 0.62) {
            e.shoot = 2.05;
            shots.push({ x: e.x, y: e.y + e.r, vy: 125, r: 5 });
          }
        }
        if (e.y > H + 24) {
          enemies.splice(i, 1);
          hurt();
          continue;
        }
        const dx = e.x - player.x, dy = e.y - player.y;
        if (dx * dx + dy * dy < (e.r + player.r) * (e.r + player.r)) {
          enemies.splice(i, 1);
          hurt();
        }
      }

      for (let i = shots.length - 1; i >= 0; i--) {
        const s = shots[i];
        s.y += s.vy * dt;
        const dx = s.x - player.x, dy = s.y - player.y;
        if (dx * dx + dy * dy < (s.r + player.r) * (s.r + player.r)) {
          shots.splice(i, 1);
          hurt();
          continue;
        }
        if (s.y > H + 10) shots.splice(i, 1);
      }

      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        let hit = false;
        for (let j = enemies.length - 1; j >= 0; j--) {
          const e = enemies[j];
          const dx = b.x - e.x, dy = b.y - e.y;
          if (dx * dx + dy * dy < (b.r + e.r) * (b.r + e.r)) {
            e.hp--;
            hit = true;
            if (e.hp <= 0) {
              score += e.score;
              GameFeel.tone(660);
              floats.push({ x: e.x, y: e.y, text: "+" + e.score, life: 0.6 });
              if (e.kind !== "small" && Math.random() < 0.45) drops.push({ x: e.x, y: e.y, vy: 70, r: 10 });
              enemies.splice(j, 1);
              sync();
            }
            break;
          }
        }
        if (hit) bullets.splice(i, 1);
      }

      for (let i = drops.length - 1; i >= 0; i--) {
        const d = drops[i];
        d.y += d.vy * dt;
        const dx = d.x - player.x, dy = d.y - player.y;
        if (dx * dx + dy * dy < (d.r + player.r + 6) * (d.r + player.r + 6)) {
          player.rapid = 3.6;
          drops.splice(i, 1);
          continue;
        }
        if (d.y > H + 10) drops.splice(i, 1);
      }
      floats.forEach((f) => { f.y -= 30 * dt; f.life -= dt; });
      floats = floats.filter((f) => f.life > 0);

      if (state === "play" && !queue.length && !enemies.length && calm <= 0) {
        if (wave >= WAVES.length - 1) {
          state = "win";
          saveBest();
          showMask("六波都折返了", "纸飞机守住了小城上空，得分 " + score + "。最佳 " + best + " 分。", "再飞一次", () => {
            document.getElementById("mask").hidden = true;
            reset();
          });
        } else {
          wave++;
          shots = [];
          beginWave(wave);
        }
      }
    }

    function plane(x, y, scale, color, nose) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      ctx.shadowColor="#25485866"; ctx.shadowBlur=5; ctx.shadowOffsetY=3;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(0, -18);
      ctx.lineTo(16, 12);
      ctx.lineTo(0, 4);
      ctx.lineTo(-16, 12);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur=0;ctx.shadowOffsetY=0;
      ctx.fillStyle='#73a9b3';ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(0,4);ctx.lineTo(-16,12);ctx.lineTo(-5,1);ctx.fill();
      ctx.strokeStyle = '#345e71';ctx.lineWidth=1.2;
      ctx.beginPath();
      ctx.moveTo(0, -18);
      ctx.lineTo(0, 8);
      ctx.moveTo(-16, 12);
      ctx.lineTo(16, 12);
      ctx.stroke();
      if (nose) {
        ctx.fillStyle = "#e23d4a";
        ctx.beginPath();
        ctx.arc(0, -6, 3, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function draw() {
      ctx.fillStyle='#a9dfe6'; ctx.fillRect(0,0,W,H);
      GameFeel.paint(ctx,W,H);
      ctx.fillStyle='#d4f0ed22';ctx.fillRect(0,0,W,H);

      drops.forEach((d) => {
        ctx.fillStyle = "#f0c14a";
        ctx.fillRect(d.x - 8, d.y - 6, 16, 12);
      });
      bullets.forEach((b) => {
        ctx.fillStyle = "#23415f";
        ctx.fillRect(b.x - 2, b.y - 8, 4, 12);
      });
      shots.forEach((s) => {
        ctx.fillStyle = "#c5364a";
        ctx.beginPath();
        ctx.moveTo(s.x, s.y + 8);
        ctx.lineTo(s.x + 5, s.y - 6);
        ctx.lineTo(s.x - 5, s.y - 6);
        ctx.fill();
      });
      enemies.forEach((e) => {
        if (e.kind === "weave") plane(e.x, e.y, 0.9, "#f4f7fb", true);
        else if (e.kind === "big") plane(e.x, e.y, 1.45, "#f7e2c4", true);
        else plane(e.x, e.y, 0.85, "#fff", false);
      });
      if (!(player.inv > 0 && Math.floor(player.inv * 14) % 2 === 0)) {
        plane(player.x, player.y, 1.15, player.rapid > 0 ? "#fff6cc" : "#f7fbff", false);
      }
      ctx.fillStyle = "#17324a";
      ctx.font = "700 16px WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif";
      ctx.textAlign = "center";
      floats.forEach((f) => ctx.fillText(f.text, f.x, f.y));
      if (calm > 0 && state === "play") {
        ctx.font = "700 28px WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif";
        ctx.fillText("第 " + (wave + 1) + " 波", W / 2, H / 2);
      }
      ctx.textAlign = "left";
    }

    function pointerX(e) {
      const rect = canvas.getBoundingClientRect();
      return (e.clientX - rect.left) * (W / rect.width);
    }
    canvas.addEventListener("pointerdown", (e) => {
      if (state !== "play") return;
      dragging = true;
      canvas.setPointerCapture(e.pointerId);
      player.x = pointerX(e);
    });
    canvas.addEventListener("pointermove", (e) => { if (dragging) player.x = pointerX(e); });
    canvas.addEventListener("pointerup", () => { dragging = false; });
    canvas.addEventListener("pointercancel", () => { dragging = false; });

    function bindHold(id, key) {
      const el = document.getElementById(id);
      const on = (e) => { e.preventDefault(); keys[key] = true; };
      const off = () => { keys[key] = false; };
      el.addEventListener("pointerdown", on);
      el.addEventListener("pointerup", off);
      el.addEventListener("pointercancel", off);
      el.addEventListener("pointerleave", off);
    }
    bindHold("left", "left");
    bindHold("right", "right");
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = true;
      if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = true;
      if (["ArrowLeft", "ArrowRight", " "].includes(e.key)) e.preventDefault();
    });
    window.addEventListener("keyup", (e) => {
      if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = false;
      if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = false;
    });

    function frame(t) {
      const dt = Math.min(0.033, last ? (t - last) / 1000 : 0.016);
      last = t;
      update(dt);
      draw();
      requestAnimationFrame(frame);
    }

    loadBest();
    sync();
    draw();
    showMask("纸飞机防线", "纸飞机守在底边，会自己朝前扔纸片。拖动或按左右移动，躲开红纸镖，别让来机碰到你或飞出底线。金色纸条能让你暂时扔得更快。守住六波即胜。", "起飞", () => {
      document.getElementById("mask").hidden = true;
      reset();
    });
    requestAnimationFrame(frame);
  </script>
</body>
</html>
