<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23e23d4a'/%3E%3C/svg%3E">
  <meta name="description" content="锦鲤消消：交换相邻锦鲤，三只同色连成一线即可消除。">
  <title>锦鲤消消</title>
  <style>
    :root {
      color-scheme: dark;
      --water: #0c2c34;
      --deep: #071c22;
      --card: #123941;
      --line: #1e5560;
      --gold: #f0c27a;
      --ink: #f4f7f6;
      --muted: #b7c9c6;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "WenQuanYi Micro Hei", "Droid Sans Fallback", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 20% 0%, rgba(240, 194, 122, .18), transparent 32%),
        radial-gradient(circle at 90% 20%, rgba(40, 140, 150, .35), transparent 28%),
        linear-gradient(180deg, #0e3a42, var(--deep) 40%);
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: radial-gradient(circle, rgba(255,255,255,.16) 0 1px, transparent 1.5px);
      background-size: 22px 22px;
      mask-image: linear-gradient(#000, transparent 80%);
      opacity: .25;
    }
    a { color: var(--gold); }
    button, a { -webkit-tap-highlight-color: transparent; }
    .wrap { width: min(520px, calc(100% - 20px)); margin: 0 auto; padding: 16px 0 28px; position: relative; }
    header { display: flex; justify-content: space-between; gap: 12px; align-items: flex-end; margin-bottom: 12px; }
    .back { font-size: .85rem; text-decoration: none; }
    h1 { margin: 4px 0 0; font-size: 1.7rem; letter-spacing: .08em; }
    .eyebrow { margin: 0; color: var(--gold); letter-spacing: .16em; font-size: .78rem; }
    .hud { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
    .stat { background: rgba(7, 28, 34, .72); border: 1px solid var(--line); border-radius: 14px; padding: 8px 10px; }
    .stat b { display: block; font-size: 1.25rem; font-variant-numeric: tabular-nums; }
    .stat span { color: var(--muted); font-size: .78rem; }
    .bar { height: 8px; border-radius: 99px; background: #0a242b; border: 1px solid var(--line); overflow: hidden; margin: 8px 0; }
    .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #e15b64, var(--gold)); }
    .note { min-height: 1.4em; margin: 0 0 8px; color: var(--gold); font-size: .92rem; }
    .board {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 4px;
      padding: 8px;
      border-radius: 18px;
      background: rgba(6, 24, 29, .78);
      border: 1px solid var(--line);
      touch-action: manipulation;
      user-select: none;
    }
    .board.locked { pointer-events: none; }
    .cell {
      aspect-ratio: 1;
      border: 0;
      padding: 0;
      border-radius: 10px;
      background: rgba(255,255,255,.04);
      color: white;
      cursor: pointer;
      position: relative;
    }
    .cell:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    .cell.sel { transform: translateY(-2px) scale(1.05); box-shadow: 0 0 0 2px var(--gold); z-index: 1; }
    .cell.hint { box-shadow: 0 0 0 2px #fff, 0 0 12px var(--gold); }
    .cell.pop .fish { animation: vanish .18s ease forwards; }
    .k0 { background: radial-gradient(circle at 30% 30%, #ff9aa2, #d23a48); }
    .k1 { background: radial-gradient(circle at 30% 30%, #ffe3a3, #e0a020); }
    .k2 { background: radial-gradient(circle at 30% 30%, #b8fff2, #149684); }
    .k3 { background: radial-gradient(circle at 30% 30%, #c3c9ee, #3a4478); }
    .k4 { background: radial-gradient(circle at 30% 30%, #ffd0e6, #d85290); }
    .k5 { background: radial-gradient(circle at 30% 30%, #f7f8ff, #9eabc4); color: #1d2740; }
    .fish { width: 78%; height: 56%; display: block; margin: 12% auto 0; }
    .fish b {
      position: absolute;
      left: 0; right: 0; bottom: 2px;
      font-size: .62rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-shadow: 0 1px 1px rgba(0,0,0,.25);
    }
    @keyframes vanish { to { transform: scale(.2); opacity: 0; } }
    .actions { display: flex; gap: 8px; margin-top: 12px; }
    .actions button, .mask button {
      font: inherit;
      border: 0;
      border-radius: 999px;
      padding: 12px 16px;
      background: var(--gold);
      color: #2a2112;
      font-weight: 700;
      cursor: pointer;
    }
    .actions button.ghost { background: transparent; color: var(--gold); border: 1px solid var(--gold); }
    .credit { color: var(--muted); font-size: .82rem; margin-top: 14px; }
    .mask {
      position: fixed;
      inset: 0;
      background: rgba(4, 14, 18, .72);
      display: grid;
      place-items: center;
      padding: 18px;
      z-index: 5;
    }
    .mask[hidden] { display: none; }
    .card {
      width: min(420px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    .card h2 { margin: 0 0 8px; font-size: 1.6rem; }
    .card p { margin: 0 0 16px; color: var(--muted); line-height: 1.7; }
    @media (prefers-reduced-motion: reduce) {
      .cell.pop .fish { animation: none; }
    }

    /* Scene art is embedded below so the downloaded HTML also works offline. */
    :root { --gold:#ffd38c; --ink:#fff7e7; --muted:#e3d6be; color-scheme:dark; }
    body { background:linear-gradient(90deg,rgba(6,25,31,.15),rgba(6,20,28,.48)),var(--scene) center/cover fixed; background-color:#17353d; }
    body::before { display:none; }
    .wrap { position:relative; padding-top:24px; }
    header { align-items:center; margin-bottom:16px; gap:12px; }
    h1:focus { outline:none; }
    header h1 { font-family:Georgia,'STSong','SimSun',serif; font-size:2rem; letter-spacing:.12em; text-shadow:0 2px 12px #15272c; }
    header a { padding:10px 12px; border:1px solid #fff5; border-radius:24px; background:#112b35b8; white-space:nowrap; font-size:12px; text-decoration:none; }
    .eyebrow { font-size:10px; letter-spacing:.3em; color:#ffe6b3; }
    .scene-strip { height:140px; margin:0 0 16px; border-radius:20px; background:linear-gradient(0deg,#092c3677,transparent 70%),var(--scene) center/cover; border:1px solid #f5d9a46b; position:relative; box-shadow:0 14px 36px #0003; }
    .scene-strip p { position:absolute; bottom:12px; left:18px; margin:0; font-family:Georgia,'STSong','SimSun',serif; letter-spacing:.15em; color:white; text-shadow:0 1px 5px #123; font-size:16px; }
    .world-intro { display:none; }
    .stat,.nextbox { background:linear-gradient(145deg,#fff9eaf7,#eadcc5ed); border:1px solid #fff5df; border-radius:12px; color:#3a453e; box-shadow:0 3px 0 #122c3b30,0 6px 16px #0002; }
    .stat span,.nextbox span { color:#78664d; font-size:11px; letter-spacing:.06em; }
    .stat b { color:#334d49; font-size:24px; }
    .help,.credit { color:#f3e3c7; text-shadow:0 1px 4px #000; }
    .help { padding:10px 14px; border-radius:10px; background:#112535d9; }
    .credit { font-size:11px; letter-spacing:.1em; }
    .pad button,.keys button,.actions button,.tools button { border-radius:12px; min-height:46px; box-shadow:0 3px 0 #0004; }
    .pad button,.keys button { background:linear-gradient(#3b5261,#233845); border:1px solid #77817c; color:#fff2d6; }
    .pad button.gold,.actions button:not(.ghost),.tools button,#jump { background:linear-gradient(#ffe6ad,#e5b36b); color:#523718; border:1px solid #ffedc1; }
    .actions button.ghost { background:#143642e6; }
    button { touch-action:manipulation; }
    button:active { filter:brightness(.92); }
    button:focus-visible,a:focus-visible { outline:3px solid #fff3b6; outline-offset:3px; }
    .mask { position:fixed; z-index:20; background:#071c306b; backdrop-filter:blur(7px); padding:20px; overflow:auto; }
    .mask .card,.mask .panel { color:#3d483f; background:linear-gradient(135deg,#fffaf0,#f0e2c9); border:1px solid #fff0c7; border-radius:24px; padding:22px; width:min(420px,100%); max-height:calc(100dvh - 40px); overflow:auto; box-shadow:0 28px 90px #05172a66; }
    .mask .card::before,.mask .panel::before { content:''; display:block; height:150px; margin:-22px -22px 20px; background:var(--scene) center/cover; border-bottom:3px solid #d3ab69; }
    .mask h2 { font-family:Georgia,'STSong','SimSun',serif; font-size:28px; letter-spacing:.12em; }
    .mask p { color:#75664e; font-size:14px; line-height:1.85; }
    .mask button { background:linear-gradient(#e6a553,#c17930); color:#fff9e9; min-height:48px; width:100%; border:1px solid #af6d30; border-radius:12px; box-shadow:0 3px 0 #986131; letter-spacing:.16em; }
    .sound { font:inherit; font-size:11px; border:1px solid #f9dda777; background:#132d3edb; color:#ffe6b3; padding:9px 13px; border-radius:20px; cursor:pointer; min-height:44px; }
    .spark { position:fixed; width:6px; height:6px; border-radius:50%; background:#ffefb5; box-shadow:0 0 10px #ffe09c; pointer-events:none; z-index:30; }
    @media(min-width:1100px) {
      body:not(.wide-game) .wrap { width:500px; margin-left:calc(50% + 30px); margin-right:auto; }
      body:not(.wide-game) .scene-strip { display:none; }
      .world-intro { display:block; position:fixed; top:27%; left:max(5%,calc(50% - 530px)); width:390px; pointer-events:none; text-shadow:0 3px 24px #04212b; }
      .world-intro small { letter-spacing:.4em; color:#ffe9bb; }
      .world-intro h2 { font:64px/1.35 Georgia,'STSong','SimSun',serif; letter-spacing:.15em; margin:20px 0; color:#fff9e9; }
      .world-intro p { font:18px/2 Georgia,'STSong','SimSun',serif; letter-spacing:.14em; color:#fff1d4; }
      .wide-game .world-intro { display:none; }
    }
    @media(max-width:600px) {
      .wrap { padding-top:16px; }
      header h1 { font-size:26px; }
      .scene-strip { height:116px; margin-bottom:12px; }
      .stat { padding:7px 10px; }
      .stat b { font-size:21px; }
      .mask .card::before,.mask .panel::before { height:130px; }
    }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important; transition:none!important; scroll-behavior:auto!important; } }


    .board { gap:5px; padding:12px; background:linear-gradient(145deg,#1e6b68e8,#0e454dee); border:3px solid #a8d8c0; border-radius:22px; box-shadow:0 7px 0 #173f46,0 16px 35px #062d4c66,inset 0 0 18px #032e38; touch-action:none; }
    .cell { background:linear-gradient(145deg,#fffcec,#e7d9b7); border:1px solid #fff8d4; box-shadow:0 3px 0 #a4926c,0 4px 7px #002d3766; border-radius:10px; color:#564b32; transition:box-shadow .15s; }
    .cell::after { content:''; position:absolute; inset:3px; border:1px solid #cdbd982e; border-radius:7px; pointer-events:none; }
    .cell.sel { box-shadow:0 0 0 3px #ffe18b,0 0 20px #ffdc89; }
    .fish { width:94%; height:78%; margin:1% auto 0; filter:drop-shadow(0 2px 1px #86724666); }
    .fish svg { width:100%; height:100%; overflow:visible; }
    .fish b { bottom:1px; font:700 9px Georgia,'SimSun',serif; text-shadow:none; color:#63523b; }
    .note { color:#fff7dc; background:#12424be8; border-radius:9px; padding:7px 10px; font-size:12px; min-height:32px; }
    .bar { height:7px; background:#12454bdd; border-color:#b9d2b477; margin:12px 0 8px; }
    .bar i { background:linear-gradient(90deg,#ed986c,#ffe49d); transition:width .35s; }
    @media(max-width:600px) { .board { padding:8px; gap:4px; border-width:2px; } .cell { border-radius:7px; } }
  </style>
</head>

    (() => {
      const picture = new Image(); picture.src = ART_DATA;
      document.documentElement.style.setProperty('--scene', 'url("' + picture.src + '")');
      const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
      let audio, enabled = false;
      const sound = document.createElement('button'); sound.type = 'button'; sound.className = 'sound';
      sound.textContent = '音效 · 关'; sound.setAttribute('aria-pressed','false');
      document.querySelector('.credit').before(sound);
      sound.onclick = () => { enabled = !enabled; sound.textContent = '音效 · ' + (enabled ? '开' : '关'); sound.setAttribute('aria-pressed',String(enabled)); if(enabled) tone(660); };
      function tone(frequency=520) {
        if(!enabled) return;
        try {
          audio ||= new (window.AudioContext || window.webkitAudioContext)();
          if(audio.state === 'suspended') audio.resume().catch(() => {});
          const oscillator=audio.createOscillator(), gain=audio.createGain(), t=audio.currentTime;
          oscillator.type='sine'; oscillator.frequency.setValueAtTime(frequency,t);
          oscillator.frequency.exponentialRampToValueAtTime(frequency*.7,t+.16);
          gain.gain.setValueAtTime(.08,t); gain.gain.exponentialRampToValueAtTime(.001,t+.23);
          oscillator.connect(gain); gain.connect(audio.destination); oscillator.start(t); oscillator.stop(t+.24);
        } catch (_) { enabled=false; sound.textContent='音效 · 不可用'; sound.setAttribute('aria-pressed','false'); }
      }
      window.GameFeel = {
        reduced, tone,
        paint(context,w,h,alpha=1) {
          if(!picture.complete || !picture.naturalWidth) return;
          const scale=Math.max(w/picture.width,h/picture.height);
          context.save(); context.globalAlpha=alpha;
          context.drawImage(picture,(w-picture.width*scale)/2,(h-picture.height*scale)/2,picture.width*scale,picture.height*scale); context.restore();
        },
        burst(element) {
          if(reduced || !element) return;
          const r=element.getBoundingClientRect();
          for(let i=0;i<9;i++) {
            const dot=document.createElement('i'); dot.className='spark';
            dot.style.left=(r.left+r.width/2)+'px'; dot.style.top=(r.top+r.height/2)+'px'; document.body.append(dot);
            const a=i*Math.PI*2/9;
            dot.animate([{opacity:1,transform:'translate(0,0) scale(1)'},{opacity:0,transform:`translate(${Math.cos(a)*48}px,${Math.sin(a)*48}px) scale(.2)`}],{duration:520,easing:'ease-out'}).finished.then(()=>dot.remove());

        }
      };

      const color=['#ee6030','#dc9b19','#229786','#465889','#db7395','#66a9c7'][t];
      const id='fish-shine-'+index;
      return `<span class="fish"><svg viewBox="0 0 72 64" aria-hidden="true"><defs><linearGradient id="${id}" x2=".5" y2="1"><stop stop-color="#fffef1"/><stop offset="1" stop-color="#e8ce97"/></linearGradient></defs><g transform="rotate(-24 36 32)"><path d="M23 31Q5 10 7 22Q1 33 8 42Q4 54 24 38" fill="${color}" stroke="#fff2ce" stroke-width="1.4"/><path d="M28 24Q33 10 43 13L39 27M28 39Q30 54 42 49L40 38" fill="${color}" opacity=".8"/><path d="M20 33C30 7 63 15 66 30C64 47 32 56 20 33" fill="url(#${id})" stroke="#fff6da" stroke-width="1.3"/><path d="M23 32Q30 19 38 20Q35 31 43 32Q33 43 28 39Z M48 18Q62 19 64 29L52 32Q43 28 48 18" fill="${color}"/><path d="M37 37Q39 49 49 42L47 35" fill="#fff8db" opacity=".85"/><path d="M34 23l2 3m6-3 2 3m-7 8 2 3m9-2 2 3" stroke="#cfb782" stroke-width=".7" fill="none"/><ellipse cx="58" cy="27" rx="4" ry="5" fill="#4d4530"/><ellipse cx="58" cy="27" rx="2.6" ry="3.8" fill="#152d36"/><circle cx="59" cy="25" r="1.2" fill="white"/><path d="M63 35q6 0 5 4M62 34q-2 3-5 2" fill="none" stroke="#ab7442" stroke-width="1"/><path d="M12 24l10 9-13 5" fill="none" stroke="#fff4c9" opacity=".8"/></g></svg><b></b></span>`;
    }

    function loadBest() {
      try { best = +localStorage.getItem("aimg-koi-best") || 0; } catch (e) { best = 0; }
    }
    function saveBest() {
      if (score <= best) return;
      best = score;
      try { localStorage.setItem("aimg-koi-best", String(best)); } catch (e) {}
    }

    function randType() { return Math.floor(Math.random() * TYPES); }

    function buildFresh() {
      for (let attempt = 0; attempt < 40; attempt++) {
        for (let r = 0; r < ROWS; r++) {
          board[r] = [];
          for (let c = 0; c < COLS; c++) {
            let t = randType();
            let guard = 0;
            while (guard++ < 12 && (
              (c >= 2 && board[r][c - 1] === t && board[r][c - 2] === t) ||
              (r >= 2 && board[r - 1][c] === t && board[r - 2][c] === t)
            )) t = randType();
            board[r][c] = t;
          }
        }
        if (findAnyMove()) return;
      }
    }

    function findMatches() {
      const hit = Array.from({ length: ROWS }, () => Array(COLS).fill(false));
      for (let r = 0; r < ROWS; r++) {
        let start = 0;
        for (let c = 1; c <= COLS; c++) {
          const same = c < COLS && board[r][c] !== null && board[r][c] === board[r][start];
          if (!same) {
            if (board[r][start] !== null && c - start >= 3) {
              for (let k = start; k < c; k++) hit[r][k] = true;
            }
            start = c;
          }
        }
      }
      for (let c = 0; c < COLS; c++) {
        let start = 0;
        for (let r = 1; r <= ROWS; r++) {
          const same = r < ROWS && board[r][c] !== null && board[r][c] === board[start][c];
          if (!same) {
            if (board[start][c] !== null && r - start >= 3) {
              for (let k = start; k < r; k++) hit[k][c] = true;
            }
            start = r;
          }
        }
      }
      const cells = [];
      for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (hit[r][c]) cells.push([r, c]);
      return cells;
    }

    function swap(r1, c1, r2, c2) {
      const t = board[r1][c1];
      board[r1][c1] = board[r2][c2];
      board[r2][c2] = t;
    }

    function findAnyMove() {
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const neighbors = [[0, 1], [1, 0]];
          for (const [dr, dc] of neighbors) {
            const r2 = r + dr, c2 = c + dc;
            if (r2 >= ROWS || c2 >= COLS) continue;
            swap(r, c, r2, c2);
            const ok = findMatches().length > 0;
            swap(r, c, r2, c2);
            if (ok) return [[r, c], [r2, c2]];
          }
        }
      }
      return null;
    }

    function collapse() {
      for (let c = 0; c < COLS; c++) {
        const stack = [];
        for (let r = ROWS - 1; r >= 0; r--) if (board[r][c] !== null) stack.push(board[r][c]);
        for (let i = 0; i < ROWS; i++) {
          const r = ROWS - 1 - i;
          board[r][c] = i < stack.length ? stack[i] : null;
        }
      }
    }

    function refill() {
      for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
        if (board[r][c] === null) board[r][c] = randType();
      }
    }

    function reshuffle() {
      const vals = [];
      for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) vals.push(board[r][c]);
      for (let attempt = 0; attempt < 40; attempt++) {
        for (let i = vals.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const tmp = vals[i]; vals[i] = vals[j]; vals[j] = tmp;
        }
        let i = 0;
        for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) board[r][c] = vals[i++];
        if (!findMatches().length && findAnyMove()) return;
      }
      buildFresh();
    }

    function render() {
      const root = document.getElementById("board");
      root.classList.toggle("locked", lock || ended);
      for (let i = 0; i < ROWS * COLS; i++) {
        const r = (i / COLS) | 0, c = i % COLS;
        let el = root.children[i];
        if (!el) {
          el = document.createElement("button");
          el.type = "button";
          el.addEventListener("click", () => { if(performance.now()>suppressClickUntil) onCell(+el.dataset.r, +el.dataset.c); });
          root.appendChild(el);
        }
        el.dataset.r = String(r);
        el.dataset.c = String(c);
        const t = board[r][c];
        if (el.dataset.kind !== String(t)) {
          el.dataset.kind = String(t);
          el.innerHTML = t == null ? "" : fishSVG(t, i);
          const label = el.querySelector("b");
          if (label) label.textContent = LABELS[t];
        }
        const sel = selected && selected.r === r && selected.c === c;
        el.className = "cell" + (t == null ? " empty" : " k" + t) + (sel ? " sel" : "") + (hintSet.has(r + "," + c) ? " hint" : "") + (popSet.has(r + "," + c) ? " pop" : "");
        el.setAttribute("aria-label", t == null ? "空位" : NAMES[t]);
        el.setAttribute("aria-pressed", sel ? "true" : "false");
      }
      document.getElementById("score").textContent = String(score);
      document.getElementById("moves").textContent = String(moves);
      document.getElementById("best").textContent = String(best);
      document.getElementById("bar").style.width = Math.min(100, (score / TARGET) * 100) + "%";
    }

    function setNote(text) { document.getElementById("note").textContent = text; }

    function showMask(title, text, btn, fn) {
      document.getElementById("maskTitle").textContent = title;
      document.getElementById("maskText").textContent = text;
      const b = document.getElementById("maskBtn");
      b.textContent = btn;
      b.onclick = fn;
      document.getElementById("mask").hidden = false;
    }
    function hideMask() { document.getElementById("mask").hidden = true; }

    async function resolve() {
      combo = 0;
      while (combo < 40) {
        const cells = findMatches();
        if (!cells.length) break;
        combo++;
        const gain = cells.length * 10 * combo;
        score += gain;
        popSet.clear();
        cells.forEach(([r, c]) => { popSet.add(r + "," + c); GameFeel.burst(document.getElementById("board").children[r*COLS+c]); });
        GameFeel.tone(420+combo*120);
        setNote(combo > 1 ? "连消 ×" + combo + "　+" + gain : "消除 +" + gain);
        render();
        await sleep(180);
        cells.forEach(([r, c]) => { board[r][c] = null; });
        popSet.clear();
        collapse();
        refill();
        render();
        await sleep(140);
      }
      saveBest();
      render();
      if (score >= TARGET) return win();
      if (moves <= 0) return lose();
      if (!findAnyMove()) {
        setNote("没有可消的组合，池水把锦鲤重新搅匀了。");
        reshuffle();
        render();
      }
      lock = false;
      render();
    }

    function win() {
      ended = true;
      lock = true;
      saveBest();
      render();
      showMask("锦鲤聚拢", "你用 " + (MOVE_MAX - moves) + " 步凑到 " + score + " 分，池塘安静下来了。", "再摆一池", startGame);
    }
    function lose() {
      ended = true;
      lock = true;
      saveBest();
      render();
      const gap = Math.max(0, TARGET - score);
      showMask("步数用完了", "得分 " + score + "，还差 " + gap + " 分。换个连法，下一池会顺一些。", "再来一局", startGame);
    }

    async function onCell(r, c) {
      if (lock || ended || board[r][c] == null) return;
      hintSet.clear();
      if (!selected) { selected = { r, c }; render(); return; }
      if (selected.r === r && selected.c === c) { selected = null; render(); return; }
      const dr = Math.abs(selected.r - r), dc = Math.abs(selected.c - c);
      if (dr + dc !== 1) { selected = { r, c }; render(); return; }
      const a = selected;
      selected = null;
      lock = true;
      if (!GameFeel.reduced) {
        const children=document.getElementById('board').children;
        const one=children[a.r*COLS+a.c], two=children[r*COLS+c];
        const ra=one.getBoundingClientRect(), rb=two.getBoundingClientRect();
        await Promise.all([one.animate([{transform:'translate(0,0)'},{transform:`translate(${rb.x-ra.x}px,${rb.y-ra.y}px)`}],{duration:140}).finished,two.animate([{transform:'translate(0,0)'},{transform:`translate(${ra.x-rb.x}px,${ra.y-rb.y}px)`}],{duration:140}).finished]);
      }
      swap(a.r, a.c, r, c);
      render();
      if (!findMatches().length) {
        await sleep(150);
        swap(a.r, a.c, r, c);
        lock = false;
        setNote("这两条不成行，换一对相邻的试试。");
        render();
        return;
      }
      moves--;
      await resolve();
    }

    function startGame() {
      hideMask();
      score = 0;
      moves = MOVE_MAX;
      combo = 0;
      ended = false;
      lock = false;
      selected = null;
      popSet.clear();
      hintSet.clear();
      buildFresh();
      setNote("目标 " + TARGET + " 分。滑动交换，或依次点两条相邻锦鲤。");
      render();
    }

    document.getElementById("hintBtn").addEventListener("click", () => {
      if (lock || ended) return;
      const move = findAnyMove();
      hintSet.clear();
      if (!move) { setNote("这一池没有可走的步。"); return; }
      move.forEach(([r, c]) => hintSet.add(r + "," + c));
      setNote("高亮的两条可以交换。");
      render();
    });
    document.getElementById("restartBtn").addEventListener("click", () => {
      if (lock && !ended) return;
      startGame();
    });

    let swipeStart=null, suppressClickUntil=0;
    const pond=document.getElementById('board');
    pond.addEventListener('pointerdown',e=>{
      const cell=e.target.closest('.cell');
      if(!cell || lock || ended) return;
      swipeStart={x:e.clientX,y:e.clientY,r:+cell.dataset.r,c:+cell.dataset.c,id:e.pointerId};
      cell.setPointerCapture(e.pointerId);
    });
    pond.addEventListener('pointerup',e=>{
      const start=swipeStart; swipeStart=null;
      if(!start || start.id!==e.pointerId || lock || ended) return;
      const dx=e.clientX-start.x,dy=e.clientY-start.y;
      if(Math.max(Math.abs(dx),Math.abs(dy))<18) return;
      suppressClickUntil=performance.now()+350;
      const r=start.r+(Math.abs(dy)>Math.abs(dx)?Math.sign(dy):0),c=start.c+(Math.abs(dx)>=Math.abs(dy)?Math.sign(dx):0);
      if(r<0||r>=ROWS||c<0||c>=COLS) return;
      selected={r:start.r,c:start.c}; onCell(r,c);
    });
    pond.addEventListener('pointercancel',()=>swipeStart=null);
    loadBest();
    buildFresh();
    showMask("锦鲤消消", "交换相邻的锦鲤，让三只以上同色连成横排或竖排。连消会加分。达到 " + TARGET + " 分就过关，一共 " + MOVE_MAX + " 步。", "开始摆鱼", startGame);
    render();
  </script>
</body>
</html>
