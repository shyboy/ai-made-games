<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='4' y='2' width='8' height='10' rx='3' fill='%23e23d4a'/%3E%3C/svg%3E">
  <meta name="description" content="灯会翻牌：翻开灯笼，找出成对的灯会图案。">
  <title>灯会翻牌</title>
  <style>
    :root { color-scheme: dark; --bg: #1a1030; --card: #2a1848; --gold: #f0c27a; --ink: #f7f1ff; --muted: #d2c4ea; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "WenQuanYi Micro Hei", "Droid Sans Fallback", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 50% -10%, rgba(240, 194, 122, .25), transparent 36%),
        linear-gradient(180deg, #2a1548, var(--bg));
    }
    button { font: inherit; -webkit-tap-highlight-color: transparent; }
    a { color: var(--gold); text-decoration: none; }
    .wrap { width: min(520px, calc(100% - 20px)); margin: 0 auto; padding: 14px 0 28px; }
    header { display: flex; justify-content: space-between; align-items: flex-end; }
    .eyebrow { margin: 0; color: var(--gold); letter-spacing: .16em; font-size: .78rem; }
    h1 { margin: 4px 0 0; font-size: 1.7rem; }
    .hud { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
    .stat { background: rgba(16, 8, 32, .55); border: 1px solid #4d3870; border-radius: 14px; padding: 8px 10px; }
    .stat span { color: var(--muted); font-size: .78rem; }
    .stat b { display: block; font-size: 1.2rem; font-variant-numeric: tabular-nums; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .card {
      border: 0; padding: 0; background: transparent; aspect-ratio: 3 / 4; cursor: pointer; perspective: 700px;
    }
    .card:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; border-radius: 12px; }
    .inner { position: relative; display: block; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .35s ease; }
    .card.on .inner, .card.matched .inner { transform: rotateY(180deg); }
    .face {
      position: absolute; inset: 0; border-radius: 12px; display: grid; place-items: center;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
      border: 1px solid #6a4d32;
    }
    .back {
      background:
        radial-gradient(circle at 50% 40%, #c5364a, #7d1d32 70%);
      color: var(--gold); font-weight: 800; letter-spacing: .2em;
    }
    .front { background: #f7efe2; color: #6b2a3a; transform: rotateY(180deg); }
    .card.matched .front { box-shadow: inset 0 0 0 2px #e0a020; }
    .face svg { width: 70%; height: 70%; }
    .tools { margin-top: 12px; }
    .tools button, .mask button {
      border: 0; background: var(--gold); color: #3a2410; font-weight: 800; border-radius: 999px; padding: 12px 16px; cursor: pointer;
    }
    .credit { color: var(--muted); font-size: .82rem; }
    .mask { position: fixed; inset: 0; background: rgba(10, 6, 18, .72); display: grid; place-items: center; padding: 16px; z-index: 3; }
    .mask[hidden] { display: none; }
    .panel { width: min(420px, 100%); background: #2a1844; border: 1px solid #5c4578; border-radius: 20px; padding: 20px; }
    .panel h2 { margin: 0 0 8px; }
    .panel p { margin: 0 0 14px; color: var(--muted); line-height: 1.7; }
    @media (prefers-reduced-motion: reduce) { .inner { transition: none; } }

    /* Scene art is embedded below so the downloaded HTML also works offline. */
    :root { --gold:#ffd38c; --ink:#fff7e7; --muted:#e3d6be; color-scheme:dark; }
    body { background:linear-gradient(90deg,rgba(6,25,31,.15),rgba(6,20,28,.48)),var(--scene) center/cover fixed; background-color:#17353d; }
    body::before { display:none; }
    .wrap { position:relative; padding-top:24px; }
    header { align-items:center; margin-bottom:16px; gap:12px; }
    h1:focus { outline:none; }
    header h1 { font-family:Georgia,'STSong','SimSun',serif; font-size:2rem; letter-spacing:.12em; text-shadow:0 2px 12px #15272c; }
    header a { padding:10px 12px; border:1px solid #fff5; border-radius:24px; background:#112b35b8; white-space:nowrap; font-size:12px; text-decoration:none; }
    .eyebrow { font-size:10px; letter-spacing:.3em; color:#ffe6b3; }
    .scene-strip { height:140px; margin:0 0 16px; border-radius:20px; background:linear-gradient(0deg,#092c3677,transparent 70%),var(--scene) center/cover; border:1px solid #f5d9a46b; position:relative; box-shadow:0 14px 36px #0003; }
    .scene-strip p { position:absolute; bottom:12px; left:18px; margin:0; font-family:Georgia,'STSong','SimSun',serif; letter-spacing:.15em; color:white; text-shadow:0 1px 5px #123; font-size:16px; }
    .world-intro { display:none; }
    .stat,.nextbox { background:linear-gradient(145deg,#fff9eaf7,#eadcc5ed); border:1px solid #fff5df; border-radius:12px; color:#3a453e; box-shadow:0 3px 0 #122c3b30,0 6px 16px #0002; }
    .stat span,.nextbox span { color:#78664d; font-size:11px; letter-spacing:.06em; }
    .stat b { color:#334d49; font-size:24px; }
    .help,.credit { color:#f3e3c7; text-shadow:0 1px 4px #000; }
    .help { padding:10px 14px; border-radius:10px; background:#112535d9; }
    .credit { font-size:11px; letter-spacing:.1em; }
    .pad button,.keys button,.actions button,.tools button { border-radius:12px; min-height:46px; box-shadow:0 3px 0 #0004; }
    .pad button,.keys button { background:linear-gradient(#3b5261,#233845); border:1px solid #77817c; color:#fff2d6; }
    .pad button.gold,.actions button:not(.ghost),.tools button,#jump { background:linear-gradient(#ffe6ad,#e5b36b); color:#523718; border:1px solid #ffedc1; }
    .actions button.ghost { background:#143642e6; }
    button { touch-action:manipulation; }
    button:active { filter:brightness(.92); }
    button:focus-visible,a:focus-visible { outline:3px solid #fff3b6; outline-offset:3px; }
    .mask { position:fixed; z-index:20; background:#071c306b; backdrop-filter:blur(7px); padding:20px; overflow:auto; }
    .mask .card,.mask .panel { color:#3d483f; background:linear-gradient(135deg,#fffaf0,#f0e2c9); border:1px solid #fff0c7; border-radius:24px; padding:22px; width:min(420px,100%); max-height:calc(100dvh - 40px); overflow:auto; box-shadow:0 28px 90px #05172a66; }
    .mask .card::before,.mask .panel::before { content:''; display:block; height:150px; margin:-22px -22px 20px; background:var(--scene) center/cover; border-bottom:3px solid #d3ab69; }
    .mask h2 { font-family:Georgia,'STSong','SimSun',serif; font-size:28px; letter-spacing:.12em; }
    .mask p { color:#75664e; font-size:14px; line-height:1.85; }
    .mask button { background:linear-gradient(#e6a553,#c17930); color:#fff9e9; min-height:48px; width:100%; border:1px solid #af6d30; border-radius:12px; box-shadow:0 3px 0 #986131; letter-spacing:.16em; }
    .sound { font:inherit; font-size:11px; border:1px solid #f9dda777; background:#132d3edb; color:#ffe6b3; padding:9px 13px; border-radius:20px; cursor:pointer; min-height:44px; }
    .spark { position:fixed; width:6px; height:6px; border-radius:50%; background:#ffefb5; box-shadow:0 0 10px #ffe09c; pointer-events:none; z-index:30; }
    @media(min-width:1100px) {
      body:not(.wide-game) .wrap { width:500px; margin-left:calc(50% + 30px); margin-right:auto; }
      body:not(.wide-game) .scene-strip { display:none; }
      .world-intro { display:block; position:fixed; top:27%; left:max(5%,calc(50% - 530px)); width:390px; pointer-events:none; text-shadow:0 3px 24px #04212b; }
      .world-intro small { letter-spacing:.4em; color:#ffe9bb; }
      .world-intro h2 { font:64px/1.35 Georgia,'STSong','SimSun',serif; letter-spacing:.15em; margin:20px 0; color:#fff9e9; }
      .world-intro p { font:18px/2 Georgia,'STSong','SimSun',serif; letter-spacing:.14em; color:#fff1d4; }
      .wide-game .world-intro { display:none; }
    }
    @media(max-width:600px) {
      .wrap { padding-top:16px; }
      header h1 { font-size:26px; }
      .scene-strip { height:116px; margin-bottom:12px; }
      .stat { padding:7px 10px; }
      .stat b { font-size:21px; }
      .mask .card::before,.mask .panel::before { height:130px; }
    }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important; transition:none!important; scroll-behavior:auto!important; } }


    .grid { gap:12px; padding:16px; background:#102b47c9; border:1px solid #d4ac68; border-radius:22px; box-shadow:0 14px 40px #03152577; }
    .grid .card { aspect-ratio:1; }
    .face { border-radius:12px; border:2px solid #e2be7c; box-shadow:0 4px 0 #61452d,0 6px 14px #04122255; }
    .back { background:radial-gradient(ellipse at 50% 45%,#80613b,#183b56 70%); }
    .back::after { content:''; position:absolute; inset:5px; border:1px solid #dabc774d; border-radius:8px; }
    .face svg { width:78%; height:78%; filter:drop-shadow(0 2px 2px #73523844); }
    .front { background:radial-gradient(circle,#fffef4,#ecdbb9); }
    .front small { position:absolute; bottom:6px; font:10px 'SimSun',serif; letter-spacing:.18em; color:#775537; }
    .card.matched .front { background:#ffefbe; border-color:#fff1a1; box-shadow:0 0 20px #ffc96355,inset 0 0 0 3px #e2be76; }
    .card.matched .front::after { content:'✓'; position:absolute; top:3px; right:6px; color:#9b722d; font-size:11px; }
    #progress { font:12px/1.6 'Microsoft YaHei',sans-serif; color:#fff0be; margin:12px 0; letter-spacing:.16em; }
    .tools { display:flex; align-items:center; justify-content:space-between; }
    @media(max-width:600px) { .grid { padding:10px; gap:9px; } .face { border-radius:9px; } .front small { bottom:3px; font-size:9px; } }
  </style>
</head>

    (() => {
      const picture = new Image(); picture.src = ART_DATA;
      document.documentElement.style.setProperty('--scene', 'url("' + picture.src + '")');
      const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
      let audio, enabled = false;
      const sound = document.createElement('button'); sound.type = 'button'; sound.className = 'sound';
      sound.textContent = '音效 · 关'; sound.setAttribute('aria-pressed','false');
      document.querySelector('.credit').before(sound);
      sound.onclick = () => { enabled = !enabled; sound.textContent = '音效 · ' + (enabled ? '开' : '关'); sound.setAttribute('aria-pressed',String(enabled)); if(enabled) tone(660); };
      function tone(frequency=520) {
        if(!enabled) return;
        try {
          audio ||= new (window.AudioContext || window.webkitAudioContext)();
          if(audio.state === 'suspended') audio.resume().catch(() => {});
          const oscillator=audio.createOscillator(), gain=audio.createGain(), t=audio.currentTime;
          oscillator.type='sine'; oscillator.frequency.setValueAtTime(frequency,t);
          oscillator.frequency.exponentialRampToValueAtTime(frequency*.7,t+.16);
          gain.gain.setValueAtTime(.08,t); gain.gain.exponentialRampToValueAtTime(.001,t+.23);
          oscillator.connect(gain); gain.connect(audio.destination); oscillator.start(t); oscillator.stop(t+.24);
        } catch (_) { enabled=false; sound.textContent='音效 · 不可用'; sound.setAttribute('aria-pressed','false'); }
      }
      window.GameFeel = {
        reduced, tone,
        paint(context,w,h,alpha=1) {
          if(!picture.complete || !picture.naturalWidth) return;
          const scale=Math.max(w/picture.width,h/picture.height);
          context.save(); context.globalAlpha=alpha;
          context.drawImage(picture,(w-picture.width*scale)/2,(h-picture.height*scale)/2,picture.width*scale,picture.height*scale); context.restore();
        },
        burst(element) {
          if(reduced || !element) return;
          const r=element.getBoundingClientRect();
          for(let i=0;i<9;i++) {
            const dot=document.createElement('i'); dot.className='spark';
            dot.style.left=(r.left+r.width/2)+'px'; dot.style.top=(r.top+r.height/2)+'px'; document.body.append(dot);
            const a=i*Math.PI*2/9;
            dot.animate([{opacity:1,transform:'translate(0,0) scale(1)'},{opacity:0,transform:`translate(${Math.cos(a)*48}px,${Math.sin(a)*48}px) scale(.2)`}],{duration:520,easing:'ease-out'}).finished.then(()=>dot.remove());
          }
        }
      };
      document.querySelectorAll('.mask').forEach(mask => {
        mask.setAttribute('role','dialog'); mask.setAttribute('aria-modal','true');
        mask.setAttribute('aria-label',document.title);
        const focus = () => {
          document.querySelector('.wrap').inert = !mask.hidden;
          if(!mask.hidden) mask.querySelector('button')?.focus({preventScroll:true});
          else document.querySelector('h1')?.focus({preventScroll:true});
        };
        document.querySelector('h1').tabIndex=-1;
        new MutationObserver(focus).observe(mask,{attributes:true,attributeFilter:['hidden']});
        // Canvas games keep their dialog inside the main wrapper.
        if(mask.closest('.wrap')) {
          document.body.append(mask);
        }
        focus();
      });

    function loadBest() {
      try {
        const v = localStorage.getItem("aimg-lantern-best");
        best = v ? +v : null;
      } catch (e) { best = null; }
    }
    function saveBest() {
      if (best == null || moves < best) {
        best = moves;
        try { localStorage.setItem("aimg-lantern-best", String(best)); } catch (e) {}
      }
    }

    function shuffle(list) {
      for (let i = list.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const tmp = list[i]; list[i] = list[j]; list[j] = tmp;
      }
      return list;
    }

    function format(ms) {
      const s = Math.floor(ms / 1000);
      const m = Math.floor(s / 60);
      return String(m).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
    }

    function render() {

      if (root.dataset.deal !== String(deal) || root.childElementCount !== cards.length) {

        cards.forEach((card, i) => {

    function tick() {
      if (!started || ended) return;
      document.getElementById("time").textContent = format(performance.now() - started);
    }

    function rating() {
      if (moves <= 12) return "过目不忘";
      if (moves <= 16) return "灯火明亮";
      return "慢慢也翻完了";
    }

    function win() {
      ended = true;
      clearInterval(timer);
      saveBest();
      render();
      const used = format(performance.now() - started);
      showMask(rating(), "你用 " + moves + " 步、" + used + " 配齐了八对灯会图案。" + (best === moves ? " 这是目前最少的步数。" : ""), "再办一场", startGame);
    }

    function flip(i) {
      if (lock || ended) return;
      const card = cards[i];
      if (card.up || card.matched) return;
      card.up = true;
      GameFeel.tone(480);
      if (!started) {
        started = performance.now();
        timer = setInterval(tick, 250);
      }
      if (first == null) { first = i; render(); return; }
      const a = first;
      first = null;
      moves++;
      render();
      if (cards[a].id === card.id) {
        cards[a].matched = true;
        card.matched = true;
        matched++;
        GameFeel.tone(880);
        GameFeel.burst(document.getElementById("grid").children[i]);
        GameFeel.burst(document.getElementById("grid").children[a]);
        render();
        if (matched === 8) { lock=true; const round=deal; setTimeout(()=>{if(deal===round) win();},450); }
        return;
      }
      lock = true;
      setTimeout(() => {
        cards[a].up = false;
        card.up = false;
        lock = false;
        render();
      }, 680);
    }

    function showMask(title, text, btn, fn) {
      document.getElementById("maskTitle").textContent = title;
      document.getElementById("maskText").textContent = text;
      const b = document.getElementById("maskBtn");
      b.textContent = btn;
      b.onclick = fn;
      document.getElementById("mask").hidden = false;
    }

    function startGame() {
      document.getElementById("mask").hidden = true;
      clearInterval(timer);
      const deck = shuffle(ICONS.concat(ICONS.map((icon) => ({ ...icon }))));
      cards = deck.map((icon) => ({ ...icon, up: false, matched: false }));
      first = null; lock = false; moves = 0; matched = 0; started = 0; ended = false; deal++;
      document.getElementById("time").textContent = "00:00";
      render();
    }

    document.getElementById("again").addEventListener("click", () => {
      if (lock) return;
      startGame();
    });

    loadBest();
    startGame();
    showMask("灯会翻牌", "每次翻开两盏灯笼。图案相同就留在桌上，不同就重新盖上。八对全部配齐即通关，步数越少越好。", "点灯", startGame);
  </script>
</body>
</html>
